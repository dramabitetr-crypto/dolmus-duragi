name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm install

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: Dik ekran ve titreşim ayarı
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $M
          grep -q 'screenOrientation="portrait"' $M && grep -q 'permission.VIBRATE' $M

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasına isim ver
        run: mv android/app/build/outputs/apk/debug/app-debug.apk DolmusDuragi-v${{ github.run_number }}.apk

      - name: Sürüm sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sürüm ${{ github.run_number }}
          files: DolmusDuragi-v${{ github.run_number }}.apk
